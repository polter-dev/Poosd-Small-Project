<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1060" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="1060" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#111">Wireframe -- frontend/contacts.html</text>
  <text x="20" y="48" font-size="12" fill="#555">Edit panel is hidden until "Edit" is clicked on a row (js/contacts.js: editContact() / cancelEditContact())</text>

  <!-- ===================== MAIN PAGE ===================== -->
  <g transform="translate(20,70)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#111">State A -- Contacts page (default)</text>
    <rect x="0" y="12" width="940" height="560" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>

    <text x="470" y="45" font-size="20" text-anchor="middle" fill="#111">My Contacts</text>

    <!-- header bar -->
    <rect x="30" y="65" width="880" height="46" rx="6" fill="#f2f2f2" stroke="#333"/>
    <text x="55" y="93" font-size="13" fill="#333">Logged in as First Last</text>
    <rect x="790" y="76" width="100" height="24" rx="12" fill="#ccc" stroke="#333"/>
    <text x="840" y="92" font-size="11" text-anchor="middle" fill="#111">Log Out</text>

    <!-- search box -->
    <rect x="30" y="126" width="880" height="34" rx="17" fill="#fff" stroke="#666"/>
    <text x="470" y="147" font-size="12" text-anchor="middle" fill="#777">Search contacts... (matches first/last name, phone, email as you type)</text>

    <!-- add contact form -->
    <rect x="30" y="176" width="880" height="120" rx="6" fill="#f2f2f2" stroke="#333"/>
    <text x="470" y="198" font-size="12" text-anchor="middle" fill="#333">ADD A CONTACT</text>

    <rect x="55" y="212" width="190" height="28" rx="14" fill="#fff" stroke="#666"/>
    <text x="150" y="230" font-size="10" text-anchor="middle" fill="#777">First Name</text>

    <rect x="260" y="212" width="190" height="28" rx="14" fill="#fff" stroke="#666"/>
    <text x="355" y="230" font-size="10" text-anchor="middle" fill="#777">Last Name</text>

    <rect x="465" y="212" width="190" height="28" rx="14" fill="#fff" stroke="#666"/>
    <text x="560" y="230" font-size="10" text-anchor="middle" fill="#777">Phone</text>

    <rect x="670" y="212" width="190" height="28" rx="14" fill="#fff" stroke="#666"/>
    <text x="765" y="230" font-size="10" text-anchor="middle" fill="#777">Email</text>

    <rect x="55" y="252" width="130" height="28" rx="14" fill="#ccc" stroke="#333"/>
    <text x="120" y="270" font-size="11" text-anchor="middle" fill="#111">Add Contact</text>
    <rect x="200" y="252" width="300" height="24" fill="none" stroke="#bbb" stroke-dasharray="3,2"/>
    <text x="350" y="268" font-size="10" text-anchor="middle" fill="#999">result message area</text>

    <!-- contacts table -->
    <rect x="30" y="312" width="880" height="240" fill="none" stroke="#333" stroke-width="1.5"/>
    <rect x="30" y="312" width="880" height="30" fill="#ddd" stroke="#333"/>
    <text x="150" y="332" font-size="11" text-anchor="middle" fill="#111">First Name</text>
    <text x="330" y="332" font-size="11" text-anchor="middle" fill="#111">Last Name</text>
    <text x="500" y="332" font-size="11" text-anchor="middle" fill="#111">Phone</text>
    <text x="670" y="332" font-size="11" text-anchor="middle" fill="#111">Email</text>
    <text x="830" y="332" font-size="11" text-anchor="middle" fill="#111">Actions</text>

    <!-- example row 1 -->
    <line x1="30" y1="372" x2="910" y2="372" stroke="#ccc"/>
    <text x="150" y="362" font-size="11" text-anchor="middle" fill="#333">Jane</text>
    <text x="330" y="362" font-size="11" text-anchor="middle" fill="#333">Doe</text>
    <text x="500" y="362" font-size="11" text-anchor="middle" fill="#333">555-0100</text>
    <text x="670" y="362" font-size="11" text-anchor="middle" fill="#333">jane@x.com</text>
    <rect x="780" y="348" width="50" height="20" rx="10" fill="#ccc" stroke="#333"/>
    <text x="805" y="362" font-size="9" text-anchor="middle" fill="#111">Edit</text>
    <rect x="836" y="348" width="60" height="20" rx="10" fill="#ccc" stroke="#333"/>
    <text x="866" y="362" font-size="9" text-anchor="middle" fill="#111">Delete</text>

    <!-- example row 2 -->
    <line x1="30" y1="412" x2="910" y2="412" stroke="#ccc"/>
    <text x="150" y="402" font-size="11" text-anchor="middle" fill="#333">John</text>
    <text x="330" y="402" font-size="11" text-anchor="middle" fill="#333">Smith</text>
    <text x="500" y="402" font-size="11" text-anchor="middle" fill="#333">555-0111</text>
    <text x="670" y="402" font-size="11" text-anchor="middle" fill="#333">john@x.com</text>
    <rect x="780" y="388" width="50" height="20" rx="10" fill="#ccc" stroke="#333"/>
    <text x="805" y="402" font-size="9" text-anchor="middle" fill="#111">Edit</text>
    <rect x="836" y="388" width="60" height="20" rx="10" fill="#ccc" stroke="#333"/>
    <text x="866" y="402" font-size="9" text-anchor="middle" fill="#111">Delete</text>

    <!-- empty state note -->
    <rect x="55" y="460" width="800" height="70" fill="none" stroke="#bbb" stroke-dasharray="4,3"/>
    <text x="470" y="490" font-size="11" text-anchor="middle" fill="#999">Alternate empty state, shown when a search/user has zero contacts:</text>
    <text x="470" y="510" font-size="12" text-anchor="middle" fill="#666" font-style="italic">"No contacts found"</text>
  </g>

  <!-- ===================== EDIT PANEL STATE ===================== -->
  <g transform="translate(20,672)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#111">State B -- Edit panel (hidden by default; opens when a row's "Edit" is clicked)</text>
    <rect x="0" y="12" width="940" height="260" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>

    <rect x="270" y="30" width="400" height="220" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
    <text x="470" y="55" font-size="12" text-anchor="middle" fill="#333">EDIT CONTACT</text>

    <rect x="300" y="68" width="340" height="26" rx="13" fill="#fff" stroke="#666"/>
    <text x="470" y="85" font-size="10" text-anchor="middle" fill="#777">First Name</text>

    <rect x="300" y="100" width="340" height="26" rx="13" fill="#fff" stroke="#666"/>
    <text x="470" y="117" font-size="10" text-anchor="middle" fill="#777">Last Name</text>

    <rect x="300" y="132" width="340" height="26" rx="13" fill="#fff" stroke="#666"/>
    <text x="470" y="149" font-size="10" text-anchor="middle" fill="#777">Phone</text>

    <rect x="300" y="164" width="340" height="26" rx="13" fill="#fff" stroke="#666"/>
    <text x="470" y="181" font-size="10" text-anchor="middle" fill="#777">Email</text>

    <rect x="330" y="200" width="130" height="26" rx="13" fill="#ccc" stroke="#333"/>
    <text x="395" y="217" font-size="10" text-anchor="middle" fill="#111">Save Changes</text>
    <rect x="480" y="200" width="100" height="26" rx="13" fill="#ccc" stroke="#333"/>
    <text x="530" y="217" font-size="10" text-anchor="middle" fill="#111">Cancel</text>
  </g>
</svg>
