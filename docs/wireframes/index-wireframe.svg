<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="620" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#111">Wireframe -- frontend/index.html (Login / Register)</text>
  <text x="20" y="48" font-size="12" fill="#555">Only one form is visible at a time; the link toggles between them (js/auth.js: showLoginForm() / showRegisterForm())</text>

  <!-- ===================== STATE A: LOGIN ===================== -->
  <g transform="translate(20,70)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#111">State A -- Login (default on page load)</text>
    <rect x="0" y="12" width="440" height="480" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- app title -->
    <text x="220" y="50" font-size="20" text-anchor="middle" fill="#111">Personal Contact Manager</text>

    <!-- login card -->
    <rect x="60" y="75" width="320" height="330" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
    <text x="220" y="105" font-size="13" text-anchor="middle" fill="#333">PLEASE LOG IN</text>

    <rect x="90" y="125" width="260" height="30" rx="15" fill="#fff" stroke="#666"/>
    <text x="220" y="145" font-size="12" text-anchor="middle" fill="#777">Username</text>

    <rect x="90" y="165" width="260" height="30" rx="15" fill="#fff" stroke="#666"/>
    <text x="220" y="185" font-size="12" text-anchor="middle" fill="#777">Password</text>

    <rect x="150" y="210" width="140" height="34" rx="17" fill="#ccc" stroke="#333"/>
    <text x="220" y="232" font-size="12" text-anchor="middle" fill="#111">Log In</text>

    <rect x="90" y="255" width="260" height="24" fill="none" stroke="#bbb" stroke-dasharray="3,2"/>
    <text x="220" y="271" font-size="10" text-anchor="middle" fill="#999">error / status message area</text>

    <text x="220" y="305" font-size="11" text-anchor="middle" fill="#333">Don't have an account?</text>
    <text x="220" y="322" font-size="11" text-anchor="middle" fill="#1155cc" text-decoration="underline">Register here (link)</text>
  </g>

  <!-- ===================== STATE B: REGISTER ===================== -->
  <g transform="translate(500,70)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#111">State B -- Register (after clicking "Register here")</text>
    <rect x="0" y="12" width="440" height="480" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>

    <text x="220" y="50" font-size="20" text-anchor="middle" fill="#111">Personal Contact Manager</text>

    <rect x="60" y="75" width="320" height="400" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
    <text x="220" y="105" font-size="13" text-anchor="middle" fill="#333">CREATE AN ACCOUNT</text>

    <rect x="90" y="122" width="260" height="28" rx="14" fill="#fff" stroke="#666"/>
    <text x="220" y="140" font-size="11" text-anchor="middle" fill="#777">First Name</text>

    <rect x="90" y="158" width="260" height="28" rx="14" fill="#fff" stroke="#666"/>
    <text x="220" y="176" font-size="11" text-anchor="middle" fill="#777">Last Name</text>

    <rect x="90" y="194" width="260" height="28" rx="14" fill="#fff" stroke="#666"/>
    <text x="220" y="212" font-size="11" text-anchor="middle" fill="#777">Username</text>

    <rect x="90" y="230" width="260" height="28" rx="14" fill="#fff" stroke="#666"/>
    <text x="220" y="248" font-size="11" text-anchor="middle" fill="#777">Password</text>

    <rect x="90" y="266" width="260" height="28" rx="14" fill="#fff" stroke="#666"/>
    <text x="220" y="284" font-size="11" text-anchor="middle" fill="#777">Confirm Password</text>

    <rect x="150" y="306" width="140" height="32" rx="16" fill="#ccc" stroke="#333"/>
    <text x="220" y="327" font-size="12" text-anchor="middle" fill="#111">Sign Up</text>

    <rect x="90" y="348" width="260" height="24" fill="none" stroke="#bbb" stroke-dasharray="3,2"/>
    <text x="220" y="364" font-size="10" text-anchor="middle" fill="#999">error / success message area</text>

    <text x="220" y="400" font-size="11" text-anchor="middle" fill="#333">Already have an account?</text>
    <text x="220" y="417" font-size="11" text-anchor="middle" fill="#1155cc" text-decoration="underline">Log in here (link)</text>
  </g>
</svg>
