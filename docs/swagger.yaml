openapi: 3.0.0
info:
  title: Personal Contact Manager API
  version: 1.0.0
  description: Login and contact search for the COP 4331 Personal Contact Manager.
servers:
  - description: Live server
    url: https://contacts.cop4331ruth.lol
paths:
  /API/Login.php:
    post:
      summary: Log in a user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: "123"
              password: "123"
      responses:
        '200':
          description: Login result. Bad credentials return id 0 and an error message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  value:
                    id: 13
                    firstName: "123"
                    lastName: "123"
                    error: ""
                badCredentials:
                  value:
                    id: 0
                    firstName: ""
                    lastName: ""
                    error: Username/password combination incorrect
  /API/SearchContacts.php:
    post:
      summary: Search a user's contacts
      operationId: searchContacts
      description: >
        Empty search returns all of the user's contacts. Zero matches returns
        an empty results array with an empty error (not an error).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              partialMatch:
                value:
                  userId: 13
                  search: ad
                  field: all
              noMatch:
                value:
                  userId: 13
                  search: zzzz
                  field: all
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                partialMatch:
                  value:
                    results:
                      - id: 19
                        firstName: Ada
                        lastName: Lovelace
                        phone: "4075550142"
                        email: ada.lovelace@example.com
                    error: ""
                emptyResult:
                  value:
                    results: []
                    error: ""
components:
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        error:
          type: string
    SearchRequest:
      type: object
      required: [userId, search]
      properties:
        userId:
          type: integer
        search:
          type: string
        field:
          type: string
          enum: [all, name, phone, email]
          default: all
    Contact:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        error:
          type: string
