<!DOCTYPE html>
<html lang="en">
<head>
	<title>Personal Contact Manager</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="css/styles.css" rel="stylesheet">
	<link href="css/accessibility.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page" onload="onIndexLoad();">

<!-- Initial page per spec: user must be able to log in OR register here. -->
<!-- showLoginForm() / showRegisterForm() in js/auth.js swap the two cards.  -->
<!-- Both cards live inside this one <main> so that whichever card is shown  -->
<!-- sits in a landmark (axe: landmark-one-main, region). js/auth.js sets    -->
<!-- style.display on the cards themselves, which this wrapper does not      -->
<!-- touch.                                                                  -->
<main class="auth-main">

<div id="loginDiv" class="auth-card reveal">
	<div class="auth-head">
		<span class="auth-mark" aria-hidden="true">
			<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
		</span>
		<h1 id="title">Contacts</h1>
		<p class="auth-lede">Log in to see your people.</p>
	</div>

	<form id="loginForm" class="auth-form" onsubmit="doLogin(); return false;">
		<div class="field">
			<label for="loginUsername">Username</label>
			<input type="text" id="loginUsername" class="input" autocomplete="username" />
		</div>
		<div class="field">
			<label for="loginPassword">Password</label>
			<input type="password" id="loginPassword" class="input" autocomplete="current-password" />
		</div>
		<span id="loginResult" aria-live="polite"></span>
		<button type="submit" id="loginButton" class="btn btn-primary btn-block">Log In</button>
	</form>

	<p class="switchText">
		Don't have an account?
		<a href="#" onclick="showRegisterForm(); return false;">Register here</a>
	</p>
</div>

<div id="registerDiv" class="auth-card" style="display:none;">
	<div class="auth-head">
		<span class="auth-mark" aria-hidden="true">
			<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
		</span>
		<h1 class="auth-title">Contacts</h1>
		<p class="auth-lede">Create an account to start your list.</p>
	</div>

	<form id="registerForm" class="auth-form" onsubmit="doRegister(); return false;">
		<div class="field-row">
			<div class="field">
				<label for="registerFirstName">First name</label>
				<input type="text" id="registerFirstName" class="input" autocomplete="given-name" />
			</div>
			<div class="field">
				<label for="registerLastName">Last name</label>
				<input type="text" id="registerLastName" class="input" autocomplete="family-name" />
			</div>
		</div>
		<div class="field">
			<label for="registerUsername">Username</label>
			<input type="text" id="registerUsername" class="input" autocomplete="username" />
		</div>
		<div class="field">
			<label for="registerPassword">Password</label>
			<input type="password" id="registerPassword" class="input" autocomplete="new-password" />
		</div>
		<div class="field">
			<label for="registerConfirmPassword">Confirm password</label>
			<input type="password" id="registerConfirmPassword" class="input" autocomplete="new-password" />
		</div>
		<span id="registerResult" aria-live="polite"></span>
		<button type="submit" id="registerButton" class="btn btn-primary btn-block">Sign Up</button>
	</form>

	<p class="switchText">
		Already have an account?
		<a href="#" onclick="showLoginForm(); return false;">Log in here</a>
	</p>
</div>

</main>

<script type="text/javascript" src="js/config.js"></script>
<script type="text/javascript" src="js/api.js"></script>
<script type="text/javascript" src="js/auth.js"></script>
<script type="text/javascript" src="js/accessibility.js"></script>
<script type="text/javascript" src="js/scroll-reveal.js"></script>
</body>
</html>
