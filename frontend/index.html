<!DOCTYPE html>
<html lang="en">
<head>
	<title>Personal Contact Manager</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="css/styles.css" rel="stylesheet">
	<link href="css/accessibility.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">
</head>
<body onload="onIndexLoad();">

<h1 id="title">Personal Contact Manager</h1>

<!-- Initial page per spec: user must be able to log in OR register here -->

<div id="loginDiv">
	<span id="inner-title">PLEASE LOG IN</span>
	<form id="loginForm" onsubmit="doLogin(); return false;">
		<label for="loginUsername" class="visually-hidden">Username</label>
		<input type="text" id="loginUsername" placeholder="Username" /><br />
		<label for="loginPassword" class="visually-hidden">Password</label>
		<input type="password" id="loginPassword" placeholder="Password" /><br />
		<button type="submit" id="loginButton" class="buttons">Log In</button>
		<span id="loginResult" aria-live="polite"></span>
	</form>

	<p class="switchText">
		Don't have an account?
		<a href="#" onclick="showRegisterForm(); return false;">Register here</a>
	</p>
</div>

<div id="registerDiv" style="display:none;">
	<span id="inner-title">CREATE AN ACCOUNT</span>
	<form id="registerForm" onsubmit="doRegister(); return false;">
		<label for="registerFirstName" class="visually-hidden">First Name</label>
		<input type="text" id="registerFirstName" placeholder="First Name" /><br />
		<label for="registerLastName" class="visually-hidden">Last Name</label>
		<input type="text" id="registerLastName" placeholder="Last Name" /><br />
		<label for="registerUsername" class="visually-hidden">Username</label>
		<input type="text" id="registerUsername" placeholder="Username" /><br />
		<label for="registerPassword" class="visually-hidden">Password</label>
		<input type="password" id="registerPassword" placeholder="Password" /><br />
		<label for="registerConfirmPassword" class="visually-hidden">Confirm Password</label>
		<input type="password" id="registerConfirmPassword" placeholder="Confirm Password" /><br />
		<button type="submit" id="registerButton" class="buttons">Sign Up</button>
		<span id="registerResult" aria-live="polite"></span>
	</form>

	<p class="switchText">
		Already have an account?
		<a href="#" onclick="showLoginForm(); return false;">Log in here</a>
	</p>
</div>

<script type="text/javascript" src="js/config.js"></script>
<script type="text/javascript" src="js/api.js"></script>
<script type="text/javascript" src="js/auth.js"></script>
<script type="text/javascript" src="js/accessibility.js"></script>
</body>
</html>
